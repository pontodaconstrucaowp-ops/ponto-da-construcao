<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#073b8c">
  <title>Ponto da Construção</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🏗️%3C/text%3E%3C/svg%3E">

  <!-- Manifesto temporariamente desativado para evitar o erro de carregamento -->
  <link rel="stylesheet" href="style.css">

  <!-- Ocultar login enquanto a sessão é verificada -->
  <style>
    html.verificando-sessao #loginScreen {
      display: none !important;
    }

    /* Logo oficial na tela de login */
    #loginScreen .login-logo {
      display: block;
      width: min(210px, 66vw);
      height: auto;
      margin: 0 auto 16px;
      object-fit: contain;
    }
  </style>

  <script>
    document.documentElement.classList.add('verificando-sessao');
  </script>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  ></script>
</head>

<body>
  <div id="loginScreen" class="login-screen">
    <div class="login-card">
      <img
        src="logo-ponto-construcao.png"
        alt="Logo Ponto da Construção Wenderson"
        class="login-logo"
      >
      <h1>Ponto da Construção</h1>
      <p>Gestão de vendas, estoque e entregas</p>

      <label>Usuário</label>
      <input
        id="loginUser"
        placeholder="Digite seu usuário"
        autocomplete="username"
      >

      <label>Senha</label>
      <input
        id="loginPass"
        type="password"
        placeholder="Digite sua senha"
        autocomplete="current-password"
      >

      <button class="primary full" onclick="login()">
        Entrar
      </button>
    </div>
  </div>

  <div id="app" class="app hidden">
    <header class="topbar">
      <div>
        <div class="eyebrow">PONTO DA CONSTRUÇÃO</div>
        <h1 id="pageTitle">Início</h1>
      </div>

      <button
        class="icon-btn"
        onclick="toggleUserMenu()"
        aria-label="Menu do usuário"
      >⋮</button>

      <div id="userMenu" class="user-menu hidden">
        <strong id="loggedUser">Administrador</strong>
        <button onclick="logout()">Sair</button>
      </div>
    </header>

    <main id="content" class="content"></main>

    <nav class="bottom-nav">
      <button data-page="home" onclick="navigate('home')">
        <span>⌂</span>Início
      </button>

      <button data-page="sales" onclick="navigate('sales')">
        <span>＋</span>Vendas
      </button>

      <button data-page="products" onclick="navigate('products')">
        <span>▦</span>Estoque
      </button>

      <button data-page="deliveries" onclick="navigate('deliveries')">
        <span>⇢</span>Entregas
      </button>

      <button data-page="more" onclick="navigate('more')">
        <span>☰</span>Mais
      </button>
    </nav>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
