
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#073b8c">

  <!-- Identificação do aplicativo -->
  <title>Ponto da Construção Wenderson</title>

  <!-- Configuração PWA -->
  <link rel="manifest" href="manifest.webmanifest">

  <!-- Ícones do aplicativo -->
  <link rel="icon" type="image/png" href="favicon-pc.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <!-- Configuração para iPhone e iPad -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Ponto da Construção">

  <!-- Estilos principais -->
  <link rel="stylesheet" href="style.css">

  <style>
    html.verificando-sessao #loginScreen {
      display: none !important;
    }

    /* Logo na tela de login */
    .login-logo {
      display: block;
      width: min(200px, 65vw);
      height: auto;
      margin: 0 auto 16px;
      object-fit: contain;
    }

    /* Pequena logo ao lado do titulo, apenas na pagina Inicio */
    .topbar-title-group {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .home-header-logo {
      display: none;
      width: 52px;
      height: 52px;
      flex: 0 0 52px;
      object-fit: contain;
      border-radius: 50%;
    }

    body:has(.bottom-nav button[data-page="home"].active) .home-header-logo {
      display: block;
    }

    @media (max-width: 480px) {
      .home-header-logo {
        width: 44px;
        height: 44px;
        flex-basis: 44px;
      }
    }
  </style>

  <script>
    document.documentElement.classList.add('verificando-sessao');
  </script>

  <!-- Mapa de entregas -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>

<body>
  <div id="loginScreen" class="login-screen">
    <div class="login-card">
      <img
        src="logo-ponto-construcao.png"
        alt="Logo Ponto da Construção Wenderson"
        class="login-logo"
      >

      <h1>Ponto da Construção</h1>
      <p>Gestão de vendas, estoque e entregas</p>

      <label>Usuário</label>
      <input
        id="loginUser"
        placeholder="Digite seu usuário"
        autocomplete="username"
      >

      <label>Senha</label>
      <input
        id="loginPass"
        type="password"
        placeholder="Digite sua senha"
        autocomplete="current-password"
      >

      <button class="primary full" onclick="login()">
        Entrar
      </button>
    </div>
  </div>

  <div id="app" class="app hidden">
    <header class="topbar">
      <div class="topbar-title-group">
        <img
          src="logo-ponto-construcao.png"
          class="home-header-logo"
          alt="Logo Ponto da Construção"
        >

        <div>
          <div class="eyebrow">PONTO DA CONSTRUÇÃO</div>
          <h1 id="pageTitle">Início</h1>
        </div>
      </div>

      <button
        class="icon-btn"
        onclick="toggleUserMenu()"
        aria-label="Menu do usuário"
      >⋮</button>

      <div id="userMenu" class="user-menu hidden">
        <strong id="loggedUser">Administrador</strong>
        <button onclick="logout()">Sair</button>
      </div>
    </header>

    <main id="content" class="content"></main>

    <nav class="bottom-nav">
      <button data-page="home" onclick="navigate('home')">
        <span>⌂</span>Início
      </button>

      <button data-page="sales" onclick="navigate('sales')">
        <span>＋</span>Vendas
      </button>

      <button data-page="products" onclick="navigate('products')">
        <span>▦</span>Estoque
      </button>

      <button data-page="deliveries" onclick="navigate('deliveries')">
        <span>⇢</span>Entregas
      </button>

      <button data-page="more" onclick="navigate('more')">
        <span>☰</span>Mais
      </button>
    </nav>
  </div>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Aplicativo -->
  <script src="app.js"></script>
</body>
</html>
